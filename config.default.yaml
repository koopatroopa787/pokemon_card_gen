# Configuration file for Pokemon Card Generator
# Copy this to config.yaml and customize for your setup

# Model Configuration
model:
  latent_dim: 100
  img_size: 256
  img_channels: 3
  feature_maps: 64

# Training Configuration
training:
  batch_size: 32
  num_epochs: 100
  learning_rate: 0.0002
  beta1: 0.5
  num_workers: 4

  # Learning rate scheduling
  use_scheduler: true
  scheduler_type: "step"  # step, cosine, exponential
  scheduler_step_size: 50
  scheduler_gamma: 0.5

  # Early stopping
  early_stopping: true
  patience: 20
  min_delta: 0.001

  # Mixed precision training (faster on modern GPUs)
  use_amp: true

# Data Configuration
data:
  dataset_dir: "data/dataset"
  output_dir: "data/generated"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"

  # Data augmentation
  augmentation:
    horizontal_flip: true
    flip_probability: 0.5
    color_jitter: true
    brightness: 0.1
    contrast: 0.1
    saturation: 0.1

# Logging Configuration
logging:
  # TensorBoard
  use_tensorboard: true
  tensorboard_dir: "runs"
  log_interval: 100  # Log every N iterations

  # Weights & Biases (optional)
  use_wandb: false
  wandb_project: "pokemon-card-gan"
  wandb_entity: null

  # Checkpointing
  save_interval: 10  # Save every N epochs
  keep_last_n: 5     # Keep only last N checkpoints

# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  reload: false
  workers: 1

  # Security
  enable_cors: true
  cors_origins: ["*"]

  # Rate limiting
  enable_rate_limit: true
  rate_limit_per_minute: 30

  # Authentication (set to true and configure keys for production)
  enable_auth: false
  api_keys: []

  # Generation limits
  max_batch_size: 16

# Inference Configuration
inference:
  device: "auto"  # auto, cpu, cuda
  default_num_images: 4
  default_seed: null
